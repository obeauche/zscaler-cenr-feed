name: Update Zscaler CENR feed

on:
  schedule:
    - cron: '17 8 * * *'  # daily, off the hour to avoid GitHub's cron rush
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate feed
        run: python3 generate_feed.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- feed.txt; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.txt
          git commit -m "Update feed $(date -u +%Y-%m-%d)"
          git push
